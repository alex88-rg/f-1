<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Моя тренировка</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header><div><small id="weekLabel">Неделя 1 / 16</small><h1>Сегодня</h1></div><button class="icon" id="themeBtn">◐</button></header>
<main id="screen"></main>
<nav>
<button data-screen="today" class="active">🏠<span>Сегодня</span></button>
<button data-screen="calendar">📅<span>Календарь</span></button>
<button data-screen="plan">📋<span>План</span></button>
<button data-screen="progress">📊<span>Прогресс</span></button>
<button data-screen="profile">⚙️<span>Профиль</span></button>
</nav>
</div>
<script src="app.js"></script>
</body>
</html>
